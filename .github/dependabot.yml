version: 2
updates:
    - package-ecosystem: composer
      directory: '/'
      schedule:
          interval: daily
      cooldown:
          default-days: 7
      groups:
          non-major:
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch
    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: daily
      cooldown:
          default-days: 7
      groups:
          non-major:
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch
